name: Website Development Task
description: Create a new development task
title: "[TASK]: "
labels:
  - frontend

body:
  - type: markdown
    attributes:
      value: |
        ## Aastha Global IT Solutions
        Complete all sections before starting development.

  - type: input
    id: objective
    attributes:
      label: Objective
      placeholder: What needs to be developed?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      placeholder: List functional requirements.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: Define success criteria.
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Feature Branch
      placeholder: feature/navbar
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low

  - type: textarea
    id: notes
    attributes:
      label: Notes